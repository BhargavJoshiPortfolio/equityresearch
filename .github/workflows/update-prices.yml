name: Refresh prices

on:
  schedule:
    # Weekdays at 21:30 UTC, after the US market close
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Exits non-zero and writes nothing if any symbol fails to download
      - name: Fetch latest prices
        run: node tools/update-prices.js

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets/data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          git commit -m "Refresh price data"
          git push
