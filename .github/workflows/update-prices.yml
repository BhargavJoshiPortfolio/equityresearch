name: Refresh prices

on:
  schedule:
    # Every day at 21:30 UTC, after both the US and European closes.
    # Weekends and holidays are harmless: no new data means no commit.
    - cron: '30 21 * * *'
  workflow_dispatch:
  # Runs once whenever this file changes, so edits to the workflow test themselves
  push:
    paths:
      - '.github/workflows/update-prices.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Exits non-zero and writes nothing if any symbol fails to download
      - name: Fetch latest prices
        run: node tools/update-prices.js

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- assets/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          git commit -m "Refresh price data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the built-in token may not trigger a Pages build on their own,
      # so ask for one explicitly. Not fatal if a build is already queued.
      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
